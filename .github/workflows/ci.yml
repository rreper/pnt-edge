name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ ninja-build python3-pip
          pip3 install --user meson
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cache subprojects
        uses: actions/cache@v4
        with:
          path: subprojects/packagecache
          key: subprojects-${{ hashFiles('subprojects/*.wrap') }}
      - name: Configure
        run: meson setup build
      - name: Build
        run: meson compile -C build
      - name: Unit tests
        run: meson test -C build --print-errorlogs
      - name: Replay smoke test
        run: ./build/pnt-edge configs/pnt-edge-replay.json --once --print-status 2>&1 | tail -3
